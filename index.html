<title>Ali's Fridge</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="Rawaid Akhtar's portfolio, stuck to a fridge.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Silkscreen&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one full-bleed 3D stage; HUD pinned to the corners like a cartridge game's overlay.
   Single deliberate look (sky-blue world, almond-fridge cream, ink dialog boxes) in every theme. */
:root{
  --sky:#4f8fd8;
  --cream:#f1ebd9;      /* the fridge's almond */
  --ink:#1c1a35;        /* outlines + dialog boxes */
  --box:rgba(20,18,44,.82);
  --tomato:#e5473a;
  --sun:#f6c445;
  --leaf:#3ba55b;
  --f-display:"Titan One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-pixel:"Silkscreen",ui-monospace,"Courier New",monospace;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--cream);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:grab;outline:none}
#stage.dragging{cursor:grabbing}
#stage.pointing{cursor:pointer}

/* ---------- chunky type ---------- */
.chunky{font-family:var(--f-display);letter-spacing:.02em;-webkit-text-stroke:.16em var(--ink);paint-order:stroke fill;text-shadow:0 .14em 0 var(--ink)}

/* ---------- HUD ---------- */
.hud-top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;display:flex;justify-content:flex-end;align-items:flex-start;gap:12px;pointer-events:none;z-index:5}
.logo{margin:0;font-size:clamp(22px,3.4vw,34px);line-height:1;color:var(--cream)}
.logo small{font-size:.62em;color:var(--sun)}
.count{margin:6px 0 0;font-family:var(--f-pixel);font-size:12px;letter-spacing:.06em;color:var(--ink);background:var(--sun);border:2px solid var(--ink);border-radius:6px;padding:4px 8px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.pill{font-family:var(--f-display);font-size:15px;letter-spacing:.03em;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:6px 14px 7px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.pill:hover{background:#fff}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pill:focus-visible,.thumb:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.pill.red{background:var(--tomato);color:#fff}

.tip{position:fixed;left:0;top:0;z-index:6;pointer-events:none;background:var(--box);color:#fff;border-radius:10px;padding:7px 11px 8px;font-family:var(--f-display);font-size:15px;letter-spacing:.02em;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip small{display:block;font-family:var(--f-pixel);font-size:10px;color:var(--sun);letter-spacing:.06em;margin-top:2px}


/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(12,12,30,.66);opacity:0;transition:opacity .25s}
.modal.show{opacity:1}
#lightbox{display:flex;align-items:stretch;justify-content:center}
.icon-btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);font-family:var(--f-display);font-size:20px;box-shadow:0 4px 0 var(--ink);cursor:pointer;display:grid;place-items:center;z-index:2}

/* lightbox */
.lb{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;justify-items:center;width:100%;max-width:1100px;padding-top:48px;box-sizing:border-box;min-height:0}
.lb-frame{position:relative;min-height:0;height:100%;width:100%;display:grid;place-items:center}
.lb-frame img{grid-area:1/1;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 14px 22px rgba(0,0,0,.45));transition:opacity .45s, transform .35s cubic-bezier(.2,1.4,.4,1)}
.lb-frame img.lo{image-rendering:pixelated}
.lb-frame img.hi{opacity:0}
.lb-frame img.hi.ready{opacity:1}
.lb-frame.pop img{transform:scale(.86)}
.lb-cap{display:flex;align-items:center;gap:14px;background:var(--box);border-radius:14px;padding:10px 12px 10px 16px;max-width:100%}
.lb-cap .txt{min-width:0}
.lb-cap h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(17px,2.4vw,22px);letter-spacing:.02em;line-height:1.15;color:#fff;text-wrap:balance}
.lb-cap p{margin:3px 0 0;font-family:var(--f-pixel);font-size:11px;letter-spacing:.06em;color:var(--sun)}
.lb-cap .nav{display:flex;gap:8px;flex:none}
.lb-cap .nav .pill{padding:4px 12px 5px;font-size:18px}
.lb-cap .num{font-family:var(--f-pixel);font-size:11px;color:#cfc9b6;white-space:nowrap;font-variant-numeric:tabular-nums}

/* list view */
.sheet{width:min(1060px,100%);max-height:100%;overflow:auto;background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink);padding:18px 18px 22px}
.sheet h2{margin:0 52px 4px 0;font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.02em}
.sheet .sub{margin:0 0 16px;font-size:15px;font-weight:600;color:#55506a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.thumb{display:grid;grid-template-rows:140px auto;gap:6px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.thumb:hover{background:#fffbea}
.thumb .ph{display:grid;place-items:center;min-height:0}
.thumb img{max-width:100%;max-height:140px;object-fit:contain}
.thumb b{font-family:var(--f-display);font-weight:400;font-size:14px;line-height:1.15;letter-spacing:.01em}
.thumb small{display:block;font-family:var(--f-pixel);font-size:9px;letter-spacing:.05em;color:#6a6480;margin-top:2px}
.sheet .x{position:sticky;top:0;float:right;margin:-4px -4px 0 0}
.sheet .x.icon-btn{position:sticky}

/* project note: an index card pinned under the magnet, with the 3D scene live behind it.
   White with blue rules, because cream belongs to the fridge. Every text line is 28px so it sits on the rules. */
.note{position:fixed;inset:0;z-index:20;pointer-events:none;--rest:-1.2deg;--left:0px;--top:0px;--width:520px}
.note-card,.note-back{position:absolute;left:var(--left);top:var(--top);width:var(--width);box-sizing:border-box;transform:rotate(var(--rest));transform-origin:50% 0}
.note-card{max-height:calc(100vh - var(--top) - 24px);max-height:calc(100dvh - var(--top) - 24px);overflow-y:auto;overscroll-behavior:contain;padding:84px 34px 28px 40px;pointer-events:auto;color:#1f1c3d;
  background:linear-gradient(#fdfdfc,#fdfdfc) 0 0/100% 71px no-repeat,linear-gradient(rgba(239,74,63,.6),rgba(239,74,63,.6)) 0 71px/100% 2px no-repeat,repeating-linear-gradient(transparent 0 27px,#d4e3f6 27px 28px),#fdfdfc;
  background-attachment:local;box-shadow:0 22px 44px rgba(20,30,60,.3),0 2px 0 rgba(0,0,0,.05)}
.note-back{display:none}
.note-chip{position:absolute;left:32px;top:24px;margin:0;padding:5px 9px;border-radius:4px;background:#1f1c3d;color:#fff;font:400 10px/1 var(--f-pixel);letter-spacing:2px;text-transform:uppercase}
.note-chip[data-side="personal"]{background:#ef4a3f}
.note-put{position:absolute;right:20px;top:13px;min-height:32px;padding:0 8px;background:none;border:0;color:#6b6987;font:400 10px/1 var(--f-pixel);letter-spacing:1px;cursor:pointer}
.note-put:hover{color:#1f1c3d}
.note-put:focus-visible,.note-links a:focus-visible{outline:2px solid #1f1c3d;outline-offset:2px}
.note-put .ph{display:none}
.note-title{margin:0;font:400 36px/56px var(--f-display);color:#1f1c3d;outline:none}
.note-meta{margin:0;font-size:13.5px;line-height:28px;font-weight:400;color:#3a3858}
.note-meta strong{font-weight:600;color:#1f1c3d}
.note-headline{margin:0;font-size:16px;line-height:28px;font-weight:600;color:#1f1c3d}
.note-headline span{background:linear-gradient(transparent 38%,rgba(245,192,64,.6) 38% 88%,transparent 88%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.note-bullets{margin:0;padding:0;list-style:none;font-size:13.5px;line-height:28px;font-weight:400;color:#2c2a48}
.note-bullets li{display:flex;gap:10px}
.note-bullets li::before{content:"—";flex:none}
.note-stack{margin:0;font:400 10.5px/28px var(--f-pixel);letter-spacing:1px;text-transform:uppercase;color:#55537a}
.note-links{margin:0;font-size:14px;line-height:28px;font-weight:600}
.note-links a{color:#1f1c3d;text-decoration-thickness:2px;text-underline-offset:4px;margin-right:16px}
.note-card.waiting{opacity:0;pointer-events:none}
.note-card.dropping{animation:noteDrop .38s cubic-bezier(.34,1.56,.64,1) both}
.note-card.lifting{animation:noteLift .18s ease-in both;pointer-events:none}
.note-card.closing{animation:noteLift .2s ease-in both;pointer-events:none}
.note-card.fading .note-inner{animation:noteFade .22s ease-out both}
@keyframes noteDrop{from{transform:translateY(-24px) rotate(-5deg);opacity:0}to{transform:rotate(var(--rest));opacity:1}}
@keyframes noteLift{to{transform:translateY(-16px) rotate(-4deg);opacity:0}}
@keyframes noteFade{from{opacity:0}to{opacity:1}}
@keyframes noteFadeOut{to{opacity:0}}
.note-pin{position:fixed;left:0;top:0;z-index:21;pointer-events:none;will-change:transform}
.note-pin img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.note-pin img.snap{animation:noteSnap .16s ease-out}
@keyframes noteSnap{from{transform:scale(1.08)}to{transform:scale(1)}}
.note-hint{position:fixed;right:24px;bottom:22px;z-index:22;margin:0;padding:8px 12px;background:#1f1c3d;color:#fff;font:400 10px/1 var(--f-pixel);letter-spacing:1px;border-radius:6px;pointer-events:none}
/* transparent stand-ins for the 3D magnets, so a keyboard or screen reader can reach them; pointers go to the canvas */
.magnet-btn{position:fixed;left:0;top:0;z-index:4;padding:0;background:none;border:0;border-radius:12px;pointer-events:none}
.magnet-btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* leave a photo */
.card{width:min(420px,100%);background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink);padding:22px 20px;display:grid;gap:12px;text-align:center}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--tomato);-webkit-text-stroke:.1em var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink);letter-spacing:.02em}
.card p{margin:0;font-size:16px;font-weight:600;line-height:1.4}
.card .fine{font-size:13px;color:#5d5872}
.pill:disabled{opacity:.55;cursor:default}
.cam{position:relative;justify-self:center;width:min(260px,100%);aspect-ratio:1;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--ink);box-shadow:0 4px 0 var(--ink)}
.cam video,.cam img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover}
.cam video.mirror{transform:scaleX(-1)}
.card .cam-msg{position:absolute;inset:0;display:grid;place-items:center;padding:16px;color:var(--cream);font-size:15px}
.card form{display:grid;gap:10px}
.card input,.card textarea{font:600 16px var(--f-body);color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:10px;padding:8px 10px;width:100%;box-sizing:border-box;resize:none}
.card input:focus-visible,.card textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#guestGrid .thumb b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:anywhere}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:40;background:var(--box);color:#fff;border-radius:12px;padding:9px 14px;font-family:var(--f-display);font-size:15px;letter-spacing:.02em;transition:opacity .4s;pointer-events:none}
.toast.gone{opacity:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


@media (max-width:640px){
  .count{display:none}
  .pill{font-size:14px;padding:5px 11px 6px}
  .lb-cap{flex-wrap:wrap;gap:8px 12px}
  .lb-cap .nav{margin-left:auto}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .thumb{grid-template-rows:110px auto}
  .thumb img{max-height:110px}
  /* the note becomes a full-width deck: bleeds off the bottom, next card peeking behind */
  .note{--rest:-1deg}
  .note-card,.note-back{left:12px;right:12px;width:auto;height:calc(100vh - var(--top) + 40px);height:calc(100dvh - var(--top) + 40px)}
  .note-card{max-height:none;padding:84px 22px calc(68px + env(safe-area-inset-bottom,0px)) 26px;touch-action:pan-y}
  .note-back{display:block;background:repeating-linear-gradient(transparent 0 27px,#d4e3f6 27px 28px),#f6f7f8;box-shadow:0 10px 24px rgba(20,30,60,.18);transform:translate(10px,12px) rotate(2.5deg);transition:transform .3s ease-out}
  .note-back.forward{transform:rotate(var(--rest))}
  .note-chip{left:22px;padding:5px 8px;font-size:9px}
  .note-put{font-size:9px}
  .note-put .ph{display:inline}
  .note-put .desk{display:none}
  .note-title{font-size:30px}
  .note-meta{font-size:13px}
  .note-meta strong{display:block}
  .note-meta .sep{display:none}
  .note-headline{font-size:15px}
  .note-bullets{font-size:13px}
  .note-stack{font-size:9.5px}
  .note-hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  .modal,.lb-frame img,.note-back{transition:none}
  .note-card.dropping,.note-card.fading .note-inner{animation:noteFade .15s linear both}
  .note-card.lifting,.note-card.closing{animation:noteFadeOut .15s linear both}
  .note-pin img.snap{animation:none}
}
</style>

<canvas id="stage" tabindex="0" role="img" aria-label="A low-poly 3D model of Ali's fridge with portfolio pieces stuck to it. Drag or use the arrow keys to spin it, and click anything to see it up close. Press L for a list of everything on it, or G to see the guest book on its side."></canvas>


<div id="tip" class="tip" hidden></div>

      <button class="pill red" id="camSnap" type="button" disabled>Take photo</button>
      <button class="pill" id="camFlip" type="button" hidden>Flip camera</button>

</div>

<script>
/* Portfolio pieces: work on the freezer door (left), personal projects on the fridge door (right),
   top to bottom in the order listed. Each is a die-cut magnet of its low-poly icon (made by
   tools/icons.html); clicking one pins its index card under it. Without an icon a piece gets a title
   card instead, and img: "img/portfolio/<file>" shows a screenshot card.
   Card fields: slug (the URL hash), role, dates, place, headline (the one outcome to lead with),
   bullets (3 at most), stack, links ({ label, href }). */
const PORTFOLIO = [
  { slug: 'fanduel', side: 'work', title: 'FanDuel', icon: 'img/portfolio/icon-dice.png',
    role: 'Senior Software Engineer', dates: 'May 2018 – present', place: 'New York',
    headline: 'Took the React Native app from 0.71 → 0.81.5, Fabric included, in about six months.',
    bullets: [
      'Lead frontend for Fantasy + Sportsbook, web and app.',
      'Scaled the Sanity CMS behind the dynamic homepage layouts.',
      'Manage and mentor frontend engineers; run hiring.',
    ],
    stack: ['React', 'RN', 'Redux', 'TS', 'Fabric', 'Sanity'],
    links: [{ label: 'fanduel.com', href: 'https://www.fanduel.com' }] },
  { slug: 'nba', side: 'work', title: 'NBA', icon: 'img/portfolio/icon-basketball.png',
    role: 'UI Developer', dates: 'Nov 2015 – Jan 2018', place: 'New York',
    headline: 'Built data-heavy, high-traffic UI for stats.nba.com and related properties.',
    bullets: ['Worked across teams to ship frontend that was fast and reliable.'],
    stack: ['AngularJS', 'WordPress'],
    links: [{ label: 'stats.nba.com', href: 'https://www.nba.com/stats' }] },
  { slug: 'perfect-eater-radio', side: 'personal', title: 'Perfect Eater Radio', icon: 'img/portfolio/icon-headphones.png',
    role: 'Founder & Engineer', dates: '2025 – present',
    headline: "An internet radio station I've spent the last year on, and we're nearing our 100th episode!",
    bullets: [
      'Everyone gets an avatar in a 2D zone, where you can chat while live shows happen.',
      'MediaMTX takes the RTMP stream in and serves HLS, behind Caddy on a DigitalOcean droplet.',
      'Every infrastructure call is mine, from stream ingest to the OBS audio pipeline.',
    ],

// die-cut magnet: the icon on a white sticker border that follows its outline, plus that outline as

function iconMagnet(img) {

      x = nx; y = ny; back = dirs.findIndex(d => d[0] === bx && d[1] === by); moved = true; break;
    }

    if (p.length < 3) return p;
    const [a, b] = [p[0], p[p.length - 1]], dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;

}

function titleCard(p, color) {

    }

  }

  lines.forEach((l, i) => { g.strokeText(l, W / 2, top + i * lh + size * 0.07); g.strokeText(l, W / 2, top + i * lh); });
  g.fillStyle = '#fbf6e8'; lines.forEach((l, i) => g.fillText(l, W / 2, top + i * lh));

}

const ali = {};
{
  const C = { skin: '#b07650', skinD: '#93603f', hair: '#221b18', shirt: '#efe5c2', shorts: '#3f69ae', shoe: '#f2efe8', metal: '#5f636b' };
  const M = { skin: lam(C.skin), skinD: lam(C.skinD), hair: lam(C.hair), shirt: lam(C.shirt), shorts: lam(C.shorts), shoe: lam(C.shoe),
    sole: lam(0x5b544f), metal: lam(C.metal, { emissive: 0x15171a }) };
  const add = (parent, geo, m, p = [0, 0, 0], s = [1, 1, 1], r = [0, 0, 0]) => {
    const o = new THREE.Mesh(geo, m); o.position.set(...p); o.scale.set(...s); o.rotation.set(...r); parent.add(o); return o;
  };

    const o = add(parent, new THREE.CylinderGeometry(r, r, d.length(), seg), m); o.position.copy(A).addScaledVector(d, 0.5);
    o.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); return o;

  // painted face: equirect on the head sphere, front center at u = .25; a big open smile
  const FW = 512, FH = 256, fc = document.createElement('canvas'); fc.width = FW; fc.height = FH; const f = fc.getContext('2d');
  const U = lon => (0.25 + lon / 360) * FW, V = lat => (0.5 - lat / 180) * FH;
  const poly = (pts, fill) => { f.beginPath(); pts.forEach(([lo, la], i) => i ? f.lineTo(U(lo), V(la)) : f.moveTo(U(lo), V(la))); f.closePath(); f.fillStyle = fill; f.fill(); };
  const faceTex = new THREE.CanvasTexture(fc); faceTex.magFilter = THREE.LinearFilter;
  function paintFace(closed) {
    f.fillStyle = C.skin; f.fillRect(0, 0, FW, FH);
    poly([[-180, 90], [180, 90], [180, 22], [60, 26], [38, 30], [22, 27], [8, 31], [-10, 28], [-26, 31], [-45, 26], [-70, 22], [-180, 22]], C.hair);
    poly([[-180, -90], [180, -90], [180, 6], [90, 6], [78, -10], [60, -17], [42, -21], [26, -22], [12, -14], [0, -15], [-12, -14], [-26, -22], [-42, -21], [-60, -17], [-78, -10], [-90, 6], [-180, 6]], C.hair);

    f.fillStyle = '#f7f1e6'; f.fillRect(U(-12), V(-20), U(12) - U(-12), 4);                                    // teeth
    f.fillStyle = '#c86a5c'; f.beginPath(); f.ellipse(U(0), V(-20) + 8, U(7) - U(0), 3, 0, 0, Math.PI); f.fill();    // tongue

      if (closed) { f.fillStyle = '#1a1412'; f.fillRect(x - 10, y + 1, 20, 3); }

  const HS = [1.08, 1, 1];
  add(head, new THREE.SphereGeometry(1, 16, 12), lam(0xffffff, { map: faceTex }), [0, 0, 0], HS);

  const mix = (a, b, t) => a + (b - a) * t;
  const shell = (w, h, fn) => {
    const g = new THREE.SphereGeometry(1, w, h), P = g.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < P.count; i++) { v.fromBufferAttribute(P, i).normalize(); const o = fn(v); P.setXYZ(i, o.x, o.y, o.z); }

    const on = sstep(yh - 0.05, yh + 0.07, n.y), phi = Math.atan2(n.x, n.z);
    let t = 0.1 + 0.14 * Math.max(0, n.y) + 0.07 * sstep(0.1, 0.7, Math.abs(n.x)) * sstep(-0.2, 0.5, n.y) + 0.025 * Math.sin(phi * 4 + n.y * 2.5);
    const dx = n.x + 0.35, dy = n.y - 0.72, dz = n.z - 0.55; t += 0.12 * Math.exp(-(dx * dx + dy * dy + dz * dz) / 0.12);
    const r = mix(0.93, 1 + t, on);
    return new THREE.Vector3(n.x * r, n.y * r + 0.05, n.z * r);
  }), M.hair, [0, 0, 0], HS);
  add(head, shell(24, 16, n => {
    const yb = mix(-0.1, -0.5, sstep(0.2, 0.75, n.z)), on = 1 - sstep(yb - 0.07, yb + 0.05, n.y);
    const front = Math.max(0, n.z), low = sstep(-0.4, -1, n.y), t = 0.06 + 0.1 * front * low, r = mix(0.93, 1 + t, on);
    return new THREE.Vector3(n.x * r, n.y * r - 0.18 * front * low * on, n.z * r + 0.06 * front * low * on);

  add(head, new THREE.TorusGeometry(0.15, 0.055, 6, 14, Math.PI), M.hair, [0, -0.33, 0.97], [1.25, 1, 0.6], [-0.15, 0, 0]);

  // wire glasses
  const gr = 0.215, gz = 1.06, gy = 0.02, gx = 0.335, tube = 0.026;
  [-1, 1].forEach(sd => {

    const edge = [sd * (gx + gr - 0.01), gy + 0.03, gz], hinge = [sd * 0.98, gy + 0.04, 0.62], ear = [sd * 1.1, gy, -0.02];

  add(body, new THREE.CylinderGeometry(0.56, 0.7, 1.0, 12, 1, false, Math.PI, Math.PI * 2), lam(0xffffff, { map: shirtTex }), [0, 1.06, 0], [1, 1, 0.8]);
  add(body, new THREE.SphereGeometry(0.56, 12, 4, 0, Math.PI * 2, 0, Math.PI / 2), M.shirt, [0, 1.56, 0], [1, 0.34, 0.8]);
  add(body, new THREE.CylinderGeometry(0.2, 0.22, 0.3, 8), M.skin, [0, 1.7, -0.02]);
  const arm = (from, to, sleeve) => {
    rod(body, from, to, 0.11, M.skin, 7);
    const s = from.map((v, k) => v + (to[k] - v) * sleeve);

  add(body, ball(0.14, 7, 5), M.skin, [0.82, 0.68, 0.06], [1, 1.1, 0.9]);

  arm([-0.52, 1.44, 0], [-1.22, 1.66, 0.1], 0.4);

function itemShapes(it, w, h) {
  const shapes = [];
  const loc = (x, y) => new THREE.Vector2((x - it.cx) / 1000, -(y - it.cy) / 1000);
  if (it.shape === 'poly') {
    shapes.push(new THREE.Shape(it.poly.map(p => loc(p[0], p[1]))));
  } else if (it.shape === 'circle') {
    const s = new THREE.Shape(); const c = loc(it.c[0], it.c[1]); s.absarc(c.x, c.y, it.r / 1000, 0, TAU, false); shapes.push(s);
  } else if (it.shape === 'circles') {
    for (const [x, y, r] of it.circles) { const s = new THREE.Shape(); const c = loc(x, y); s.absarc(c.x, c.y, r / 1000, 0, TAU, false); shapes.push(s); }
  } else {
    const r = Math.min(w, h) * 0.08, s = new THREE.Shape(), x0 = -w / 2, y0 = -h / 2;
    s.moveTo(x0 + r, y0); s.lineTo(x0 + w - r, y0); s.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + r);
    s.lineTo(x0 + w, y0 + h - r); s.quadraticCurveTo(x0 + w, y0 + h, x0 + w - r, y0 + h);
    s.lineTo(x0 + r, y0 + h); s.quadraticCurveTo(x0, y0 + h, x0, y0 + h - r); s.lineTo(x0, y0 + r); s.quadraticCurveTo(x0, y0, x0 + r, y0);
    shapes.push(s);
  }
  return shapes;
}
function remapUV(g, w, h) {
  const p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / w + 0.5, p.getY(i) / h + 0.5);
  uv.needsUpdate = true;

  stopCam(); camStep('snap'); $('#camSnap').disabled = true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camFail("This browser can't open a camera here.");
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: camFacing, width: { ideal: 1280 }, height: { ideal: 1280 } } });
  } catch (e) {
    return camFail(e.name === 'NotAllowedError' || e.name === 'SecurityError' ? "The camera's blocked. Allow it for this site, then tap the board again." : "Couldn't find a camera on this device.");
  }
  // the card may have been closed while the permission prompt was up
  if (openModalEl !== $('#leave') || !$('#stepNote').hidden) { stream.getTracks().forEach(t => t.stop()); return; }
  camStream = stream; camVideo.srcObject = stream; camVideo.classList.toggle('mirror', camFacing === 'user');
  await camVideo.play().catch(() => {});
  $('#camSnap').disabled = false; $('#camSnap').focus({ preventScroll: true });
  const cams = (await navigator.mediaDevices.enumerateDevices().catch(() => [])).filter(d => d.kind === 'videoinput');
  $('#camFlip').hidden = cams.length < 2;
}
function squareShot(size, source) {
  const sw = source.videoWidth || source.width, sh = source.videoHeight || source.height, s = Math.min(sw, sh);
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  if (source === camVideo && camFacing === 'user') { g.translate(size, 0); g.scale(-1, 1); }   // keep it the way they saw it
  g.drawImage(source, (sw - s) / 2, (sh - s) / 2, s, s, 0, 0, size, size);
  return c;
}
$('#camSnap').addEventListener('click', () => {
  if (!camVideo.videoWidth) return;
  shot = squareShot(800, camVideo);
  camShot.src = shot.toDataURL('image/jpeg', 0.82);
  stopCam(); camStep('note'); $('#gbName').focus({ preventScroll: true });
});
$('#camFlip').addEventListener('click', () => { camFacing = camFacing === 'user' ? 'environment' : 'user'; startCam(); });
$('#camRetake').addEventListener('click', () => { shot = null; startCam(); });

$('#stepNote').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#gbSend'); if (btn.disabled || !shot) return;
  const name = $('#gbName').value.trim(), msg = $('#gbMsg').value.trim();
  let id = 'mine-' + Date.now(), ts = Date.now();
  if (api) {
    btn.disabled = true; btn.textContent = 'Sticking…';
    try {
      const r = await fetch(api + '/entries', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ img: shot.toDataURL('image/jpeg', 0.82), name, msg }) });
      if (!r.ok) throw new Error(r.status);
      ({ id, ts } = await r.json());
    } catch (err) {
      toast(err.message === '429' ? "That's plenty for one day. Come back tomorrow!" : "Couldn't reach the fridge. Try again?");
      return;
    } finally { btn.disabled = false; btn.textContent = 'Stick it on the fridge'; }
  }
  // keep a small copy here so it's on the fridge whenever they come back
  saveMine([{ id, name, msg, ts, img: squareShot(480, shot).toDataURL('image/jpeg', 0.8) }, ...readMine()]);
  shot = null; $('#gbMsg').value = '';
  closeModal(); mergeGuests(); face(Math.PI / 2);
  toast('Stuck it on the fridge');
});

function openGuests() {
  const grid = $('#guestGrid'); grid.textContent = '';
  guests.forEach((g, i) => {
    const b = document.createElement('button'); b.className = 'thumb'; b.type = 'button';
    const ph = document.createElement('span'); ph.className = 'ph';
    const img = document.createElement('img'); img.loading = 'lazy'; img.src = g.src; img.alt = ''; ph.append(img);
    const t = document.createElement('span'); const bb = document.createElement('b'); bb.textContent = g.msg || 'Signed the guest book';
    const sm = document.createElement('small'); sm.textContent = `${g.name || 'A guest'} · ${dateOf(g.ts)}`.toUpperCase();
    t.append(bb, sm); b.append(ph, t);
    b.addEventListener('click', () => openVisitor(i));
    grid.append(b);
  });
  openModal('#guests');
  grid.firstElementChild && grid.firstElementChild.focus({ preventScroll: true });
}

/* ------------------------------------------------------------------ loop */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;

  updateCamMove(now);

  // spin
  if (rig.yawTo !== null) {
    const d = rig.yawTo - rig.yaw; rig.yaw += d * (1 - Math.exp(-dt * 6));
    if (Math.abs(d) < 0.0005) { rig.yaw = rig.yawTo; rig.yawTo = null; }
  } else if (!drag) {
    rig.yaw += rig.yawVel * dt; rig.yawVel *= Math.exp(-dt * 3.2);
    if (Math.abs(rig.yawVel) < 0.01) rig.yawVel = 0;
  }
  spin.rotation.y = rig.yaw;

  // camera
  rig.dist += (rig.distTo - rig.dist) * (1 - Math.exp(-dt * rig.ease));
  const ty = THREE.MathUtils.mapLinear(THREE.MathUtils.clamp(rig.dist, rig.minD, rig.homeD || 4), rig.minD, rig.homeD || 4, 0.12, 0);
  camera.position.set(rig.target.x, rig.target.y + ty + Math.sin(rig.pitch) * rig.dist, rig.target.z + Math.cos(rig.pitch) * rig.dist);
  camera.lookAt(rig.target.x, rig.target.y + ty, rig.target.z);
  updateOverlays();

  // hover lift
  for (const e of entries) {
    if (flying && flying.e === e) continue;
    const to = e.liftTo; if (e.lift === to) continue;
    e.lift += (to - e.lift) * (1 - Math.exp(-dt * 18)); if (Math.abs(e.lift - to) < 0.002) e.lift = to;
    e.group.position.z = e.home.p.z + e.lift * 0.008;
    e.group.scale.setScalar(1 + e.lift * 0.05);
    e.shadow.position.set(0.0018 + e.lift * 0.003, -0.0026 - e.lift * 0.005, -0.0004 - e.lift * 0.006);
    e.shadow.material = e.lift > 0.01 ? shadowLift : shadowM;
  }
  updateFlight(dt);

  // ambient life
  clouds.rotation.y = t * 0.006;
  for (const p of plantLeaves) p.leaf.rotation.y = Math.sin(t * 0.9 + p.ph) * 0.05;
  ali.update(t);

  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  requestAnimationFrame(frame);
}
const shadowLift = basic(0x000000, { transparent: true, opacity: 0.16, depthWrite: false });

if (renderer) {
  resize();
  rig.distTo = rig.homeD;
  if (!reduceMotion) {
    // open on a three-quarter view and ease round to the front, so it reads as 3D straight away
    rig.yaw = 0.85; rig.yawTo = 0; rig.dist = rig.homeD * 1.3; rig.ease = 2.2;
    setTimeout(() => { rig.ease = 7; }, 1800);
  } else rig.dist = rig.homeD;
  requestAnimationFrame(frame);
  openFromHash(true);
} else {
  // no WebGL: skip straight to the list, which works on its own
  canvas.hidden = true;
  $('#listSub').textContent = "Your browser couldn't start the 3D view, so here's everything on the fridge as a list.";
  openList();
  openFromHash(true);
}
window.__fridge = { rig, entries, openItem, face, sign: () => openModal('#leave'), guestBook: openGuests, get mode() { return mode; }, get phase() { return phase; }, get current() { return current; } };

</script>
